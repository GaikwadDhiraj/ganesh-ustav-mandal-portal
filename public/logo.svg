<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>

    <!-- Inner Radial Glow -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF9C3" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>

    <!-- Shadow Effect -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Outer Rounded Shield Circle -->
  <circle cx="250" cy="250" r="230" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="12" filter="url(#dropShadow)" />

  <!-- Inner Decorative Sunburst Circle -->
  <circle cx="250" cy="250" r="195" fill="none" stroke="#FEF08A" stroke-width="4" stroke-dasharray="12 8" opacity="0.6" />

  <!-- Radial Glow Background -->
  <circle cx="250" cy="210" r="120" fill="url(#glow)" />

  <!-- Sacred Ganesha Stylized Line Art -->
  <g transform="translate(250, 200) scale(1.6)" filter="url(#dropShadow)">
    <!-- Tilak / Crown Crest -->
    <path d="M 0,-75 Q 12,-90 0,-105 Q -12,-90 0,-75 Z" fill="url(#goldGrad)" />
    <circle cx="0" cy="-60" r="6" fill="#DC2626" />
    <path d="M -15,-60 Q 0,-48 15,-60 Q 0,-52 -15,-60 Z" fill="url(#goldGrad)" />

    <!-- Ears & Head -->
    <path d="M -50,-40 C -70,-20 -50,10 -30,0 C -25,-10 -15,-30 0,-30 C 15,-30 25,-10 30,0 C 50,10 70,-20 50,-40 C 35,-50 -35,-50 -50,-40 Z" fill="url(#goldGrad)" />
    
    <!-- Trunk (Trishul & Modak Curve) -->
    <path d="M -12,-15 Q 0,-5 12,-15 Q 18,10 10,35 Q 2,55 20,65 Q 28,68 25,75 Q 15,80 -2,68 Q -18,52 -10,25 Q -5,5 -12,-15 Z" fill="url(#goldGrad)" />

    <!-- Tusk Accent -->
    <path d="M -22,0 L -30,4 L -20,8 Z" fill="#FFFFFF" />

    <!-- Modak Snack Symbol -->
    <path d="M 28,65 Q 35,50 42,65 Q 35,72 28,65 Z" fill="#FEF08A" />
  </g>

  <!-- Circular Text Frame Banner -->
  <path id="textArc" d="M 75,340 A 185,185 0 0,0 425,340" fill="none" />

  <!-- Main Marathi Title -->
  <text text-anchor="middle" fill="#FFFFFF" font-family="'Noto Sans Devanagari', 'Arial', sans-serif" font-weight="900" font-size="34" letter-spacing="1">
    <textPath href="#textArc" startOffset="50%" text-anchor="middle">
      गणेश मंडळ वेब पोर्टल
    </textPath>
  </text>

  <!-- Tagline Text Banner -->
  <rect x="110" y="385" width="280" height="42" rx="21" fill="url(#goldGrad)" stroke="#B45309" stroke-width="3" filter="url(#dropShadow)" />
  <text x="250" y="413" text-anchor="middle" fill="#78350F" font-family="'Noto Sans Devanagari', 'Arial', sans-serif" font-weight="800" font-size="20">
    महोत्सव डिजिटल मंच
  </text>

  <!-- Decorative Marigold Flowers -->
  <circle cx="95" cy="406" r="14" fill="#F97316" stroke="#FEF08A" stroke-width="2" />
  <circle cx="95" cy="406" r="7" fill="#FACC15" />
  <circle cx="405" cy="406" r="14" fill="#F97316" stroke="#FEF08A" stroke-width="2" />
  <circle cx="405" cy="406" r="7" fill="#FACC15" />
</svg>
